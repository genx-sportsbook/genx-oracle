<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GENX-SPORTSBOOK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="topbar">
    <span class="title">GENX-<span class="title-accent">SPORTSBOOK</span></span>
    <div class="topbar-right">
      <div class="dropdown" id="competitionDropdown">
        <button type="button" class="dropdown-trigger" id="competitionTrigger"
                aria-haspopup="listbox" aria-expanded="false" aria-controls="competitionList">
          <span id="competitionTriggerLabel">All Competitions</span>
          <span class="dropdown-chevron" aria-hidden="true"></span>
        </button>
        <ul class="dropdown-list" id="competitionList" role="listbox"
            aria-label="Filter by competition" tabindex="-1" hidden>
          <li class="dropdown-option selected" role="option" aria-selected="true"
              data-value="" id="compopt-all">All Competitions</li>
        </ul>
      </div>
      <span id="fixtureCount" class="stat">0 fixtures</span>
      <span id="totalUpdates" class="stat">0 updates</span>
      <span id="lastUpdate" class="stat">Updated —</span>
      <span id="clock" class="stat">00:00:00</span>
      <span class="status">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">connecting</span>
      </span>
    </div>
  </div>

  <table id="dashboard">
    <thead>
      <tr>
        <th>Fixture</th>
        <th>Market</th>
        <th>Prices</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <div id="backdrop" class="backdrop"></div>
  <aside id="historyPanel" class="history-panel">
    <div class="history-header">
      <span id="historyTitle"></span>
      <button id="historyClose" class="close-btn" aria-label="Close">&times;</button>
    </div>
    <div id="historyList" class="history-list"></div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
