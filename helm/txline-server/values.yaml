replicaCount: 1

image:
  repository: ghcr.io/genx-sportsbook/txline-server
  # Empty by default so it tracks the chart's own appVersion — bump
  # appVersion in Chart.yaml (see the release checklist in CLAUDE.md) and
  # `helm upgrade` deploys that version with no --set needed. Override only
  # to pin a specific image tag independent of the chart version.
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: nginx
  host: txline.example.com
  # tls:
  #   - secretName: txline-tls
  #     hosts:
  #       - txline.example.com

credentials:
  # Option A — inline JSON (base64-encoded), chart creates the Secret:
  #   --set credentials.json="$(base64 -w0 .txline-credentials.json)"
  json: ""
  # Option B — reference a pre-existing Kubernetes Secret (no JSON needed at install time):
  #   kubectl create secret generic my-txline-secret --from-file=.txline-credentials.json
  #   --set credentials.existingSecret=my-txline-secret
  existingSecret: ""
