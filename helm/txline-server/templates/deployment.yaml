{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "txline-server requires one replica for its local SQLite ingester" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "txline-server.fullname" . }}
  labels:
    {{- include "txline-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "txline-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "txline-server.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: txline-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: TXLINE_DATABASE
              value: /app/data/txline.sqlite3
          ports:
            - containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Probes only check the web process and its local database.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
        - name: txline-ingest
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: TXLINE_DATABASE
              value: /app/data/txline.sqlite3
          command: ["txline-ingest"]
          args: ["--credentials", "/app/credentials/.txline-credentials.json"]
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: credentials
              mountPath: /app/credentials
              readOnly: true
          resources:
            {{- toYaml .Values.ingestResources | nindent 12 }}
      volumes:
        - name: data
          {{- if or .Values.persistence.enabled .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "txline-server.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: credentials
          secret:
            secretName: {{ .Values.credentials.existingSecret | default (printf "%s-credentials" (include "txline-server.fullname" .)) }}
