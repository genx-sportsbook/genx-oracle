apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "txline-server.fullname" . }}
  labels:
    {{- include "txline-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "txline-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "txline-server.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: txline-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
              protocol: TCP
          volumeMounts:
            - name: credentials
              mountPath: /app/credentials
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # All three probes hit /healthz, which is process-local and does no
          # upstream work. They used to point at /fixtures, which fetches and
          # parses ~68MB of the global fixture catalog — measured at ~9s cold,
          # well past the old timeoutSeconds: 10 — so the probe itself was what
          # flapped the pod out of the endpoints list.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: credentials
          secret:
            secretName: {{ .Values.credentials.existingSecret | default (printf "%s-credentials" (include "txline-server.fullname" .)) }}
